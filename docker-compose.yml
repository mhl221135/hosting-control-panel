services:
  hosting-sync:
    image: syncthing/syncthing:2.1.2
    container_name: hosting-sync
    restart: unless-stopped
    user: "33:33"
    ports:
      - "${SYNC_LISTEN_IP:-0.0.0.0}:${SYNC_PORT:-22001}:22000/tcp"
      - "${SYNC_LISTEN_IP:-0.0.0.0}:${SYNC_PORT:-22001}:22000/udp"
      - "${SYNC_GUI_LISTEN_IP:-127.0.0.1}:${SYNC_GUI_PORT:-8834}:8384/tcp"
    volumes:
      - ${SYNC_CONFIG_DIR:-${HOSTING_MACHINE_STATE_DIR:-/etc/hosting-control}/syncthing}:/var/syncthing/config
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/websites:/var/syncthing/websites
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/app-data/configs:/var/syncthing/runtime-config
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/replication:/var/syncthing/replication
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${SYNC_MEMORY_LIMIT:-2g}
    cpus: ${SYNC_CPU_LIMIT:-1.50}
    networks:
      - hosting-net
    healthcheck:
      test: ["CMD-SHELL", "key=$$(sed -n 's:.*<apikey>\\(.*\\)</apikey>.*:\\1:p' /var/syncthing/config/config.xml); syncthing cli --gui-address=http://127.0.0.1:8384 --gui-apikey=$$key show system >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  hosting-agent:
    image: hosting-agent:1.1
    build:
      context: ./control-agent
    container_name: hosting-agent
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      HOSTING_AGENT_TOKEN: ${HOSTING_AGENT_TOKEN:?Set HOSTING_AGENT_TOKEN in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - hosting-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8790/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  hosting-cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    container_name: hosting-cloudflared
    profiles:
      - tunnel
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:20241", "run", "--token-file", "/run/secrets/hosting-tunnel-token"]
    volumes:
      - ${HOSTING_TUNNEL_TOKEN_FILE:-/etc/hosting-control/cloudflared-hosting.token}:/run/secrets/hosting-tunnel-token:ro
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.50
    networks:
      - hosting-net
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  hosting-files:
    image: hosting-files:2.63
    build:
      context: ./filebrowser-custom
    container_name: hosting-files
    user: "33:33"
    environment:
      FILEBROWSER_ADMIN_USERNAME: ${FILEBROWSER_ADMIN_USERNAME:?Set FILEBROWSER_ADMIN_USERNAME in .env}
      FILEBROWSER_ADMIN_PASSWORD: ${FILEBROWSER_ADMIN_PASSWORD:?Set FILEBROWSER_ADMIN_PASSWORD in .env}
    volumes:
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/websites:/srv
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/app-data/filebrowser/config:/config
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/app-data/filebrowser/database:/database
    restart: unless-stopped
    networks:
      - hosting-net

  hosting-ui:
    image: hosting-ui:2.42
    build:
      context: ./ui-manager
    container_name: hosting-ui
    user: "33:33"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8687:8687"
    environment:
      PORT: 8687
      DATA_DIR: /app/data
      SITES_MAP_PATH: /srv/configs/nginx/conf.d/sites.map
      POOLS_PATH: /srv/configs/php-fpm/pools.conf
      CACHE_MAP_PATH: /srv/configs/nginx/conf.d/cache.map
      WP_CACHE_CONTROL_STATE_PATH: /srv/configs/wp/wordpress-cache-control.json
      BILLING_ENFORCEMENT_MAP_PATH: /srv/configs/nginx/conf.d/billing-enforcement.map
      WEBSITES_ROOT: /srv/websites
      APP_DATA_ROOT: /srv/app-data
      BACKUPS_ROOT: /srv/backups
      OFFSITE_ACCESS_KEY_ID: ${OFFSITE_ACCESS_KEY_ID:-}
      OFFSITE_SECRET_ACCESS_KEY: ${OFFSITE_SECRET_ACCESS_KEY:-}
      OFFSITE_REPOSITORY_PASSWORD: ${OFFSITE_REPOSITORY_PASSWORD:-}
      EXPORTS_ROOT: /srv/exports
      IMPORTS_ROOT: /srv/imports
      JOB_HISTORY_LIMIT: ${JOB_HISTORY_LIMIT:-250}
      PROVISION_CREDENTIAL_TTL_HOURS: ${PROVISION_CREDENTIAL_TTL_HOURS:-24}
      TRANSFER_BUNDLE_UPLOAD_LIMIT_BYTES: ${TRANSFER_BUNDLE_UPLOAD_LIMIT_BYTES:-17179869184}
      NOTIFICATION_HISTORY_LIMIT: ${NOTIFICATION_HISTORY_LIMIT:-500}
      HEALTH_HISTORY_LIMIT: ${HEALTH_HISTORY_LIMIT:-250}
      MYSQL_CONTAINER: hosting-db
      PHP_CONTAINER: hosting-php-fpm
      STANDBY_PROFILE_NAME: ${STANDBY_PROFILE_NAME:-}
      MYSQL_SERVER_ID: ${MYSQL_SERVER_ID:-1}
      MYSQL_INNODB_BUFFER_POOL_SIZE: ${MYSQL_INNODB_BUFFER_POOL_SIZE:-2G}
      MYSQL_INNODB_REDO_LOG_CAPACITY: ${MYSQL_INNODB_REDO_LOG_CAPACITY:-1G}
      MYSQL_MAX_CONNECTIONS: ${MYSQL_MAX_CONNECTIONS:-150}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-1024mb}
      HOSTING_AGENT_URL: http://hosting-agent:8790
      HOSTING_AGENT_TOKEN: ${HOSTING_AGENT_TOKEN:?Set HOSTING_AGENT_TOKEN in .env}
      BILLING_API_URL: http://hosting-billing:8787/internal/v1
      BILLING_API_TOKEN: ${BILLING_API_TOKEN:?Set BILLING_API_TOKEN in .env}
      TZ: Europe/Kyiv
      UI_ADMIN_EMAIL: ${UI_ADMIN_EMAIL:?Set UI_ADMIN_EMAIL in .env}
      UI_ADMIN_PASSWORD: ${UI_ADMIN_PASSWORD:?Set UI_ADMIN_PASSWORD in .env}
      UI_SETTINGS_KEY: ${UI_SETTINGS_KEY:-}
      INSTALLATION_ROLE: ${INSTALLATION_ROLE:-standalone}
      SERVER_ID: ${SERVER_ID:-hosting-server}
      HOSTING_PEER_HEALTH_URL: ${HOSTING_PEER_HEALTH_URL:-}
      HOSTING_PEER_SERVER_ID: ${HOSTING_PEER_SERVER_ID:-}
      HOSTING_PEER_API_TOKEN: ${HOSTING_PEER_API_TOKEN:-}
      HOSTING_SYNC_PEER_DEVICE_ID: ${HOSTING_SYNC_PEER_DEVICE_ID:-}
      INSTALLATION_ROLE_PATH: /run/hosting-machine/role.json
      NPM_API_URL: ${NPM_API_URL:-http://hosting-npm:81/api}
      NPM_IDENTITY: ${NPM_IDENTITY:?Set NPM_IDENTITY in .env}
      NPM_SECRET: ${NPM_SECRET:?Set NPM_SECRET in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_SECURITY_API_TOKEN: ${CLOUDFLARE_SECURITY_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      IPINFO_TOKEN: ${IPINFO_TOKEN:-}
      MYSQL_SITE_PREFIX: ${MYSQL_SITE_PREFIX:-yogali00_}
      RELOAD_NGINX_CMD: "docker exec hosting-nginx nginx -s reload"
      RELOAD_PHP_CMD: "docker exec hosting-php-fpm sh -c 'kill -USR2 1'"
      CLEAR_OPCACHE_CMD: "docker exec hosting-php-fpm sh -lc 'kill -USR2 1'"
    volumes:
      - ${UI_DATA_DIR:-${HOSTING_ROOT:-/media/ssdmount/websites-v2}/app-data/ui-manager}:/app/data
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/websites:/srv/websites
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/app-data:/srv/app-data:ro
      - ${BACKUPS_DIR:-${HOSTING_ROOT:-/media/ssdmount/websites-v2}/backups}:/srv/backups
      - ${EXPORTS_DIR:-${HOSTING_ROOT:-/media/ssdmount/websites-v2}/exports}:/srv/exports
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/imports:/srv/imports
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/replication:/srv/replication:ro
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/app-data/configs/nginx:/srv/configs/nginx
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/app-data/configs/php-fpm:/srv/configs/php-fpm
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/app-data/configs/php:/srv/configs/php
      - ${PHP_GLOBAL_INI_PATH:-${HOSTING_ROOT:-/media/ssdmount/websites-v2}/app-data/configs/php/global.ini}:/srv/configs/php/global.ini
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/app-data/configs/wp:/srv/configs/wp
      - ${HOSTING_MACHINE_STATE_DIR:-/etc/hosting-control}/role.json:/run/hosting-machine/role.json:ro
    networks:
      - hosting-net
    depends_on:
      hosting-agent:
        condition: service_healthy

  hosting-billing:
    image: hosting-billing:1.2
    build:
      context: ./billing-service
    container_name: hosting-billing
    user: "33:33"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      DATA_DIR: /app/data
      BACKUPS_ROOT: /srv/backups
      BILLING_ADMIN_EMAIL: ${BILLING_ADMIN_EMAIL:-${UI_ADMIN_EMAIL}}
      BILLING_ADMIN_PASSWORD: ${BILLING_ADMIN_PASSWORD:-${UI_ADMIN_PASSWORD}}
      BILLING_API_TOKEN: ${BILLING_API_TOKEN:?Set BILLING_API_TOKEN in .env}
      BILLING_BACKUP_RETENTION: ${BILLING_BACKUP_RETENTION:-14}
      BILLING_SETTINGS_KEY: ${BILLING_SETTINGS_KEY:-}
      NOTIFICATION_API_URL: http://hosting-ui:8687/internal/v1/billing-reminders
      ENTITLEMENT_REFRESH_API_URL: http://hosting-ui:8687/internal/v1/billing-entitlements/refresh
      TZ: Europe/Kyiv
    volumes:
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/app-data/billing:/app/data
      - ${BACKUPS_DIR:-${HOSTING_ROOT:-/media/ssdmount/websites-v2}/backups}/billing:/srv/backups
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - hosting-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  hosting-php-fpm:
    image: custom-php-fpm:8.4
    build:
      context: ./php-fpm-custom-upd
    container_name: hosting-php-fpm
    restart: unless-stopped
    volumes:
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/websites:/var/www
      - ${PHP_GLOBAL_INI_PATH:-${HOSTING_ROOT:-/media/ssdmount/websites-v2}/app-data/configs/php/global.ini}:/usr/local/etc/php/conf.d/000-global.ini:ro
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/app-data/configs/php-fpm/php-fpm.conf:/usr/local/etc/php-fpm.conf:ro
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/app-data/configs/php-fpm:/runtime-php-fpm:ro
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/app-data/configs/wp/wp-global.php:/global/wp-global.php:ro
      - ./global-configs-new-upd/wp/opcache-status.php:/global/opcache-status.php:ro
    networks:
      - hosting-net

  hosting-nginx:
    image: nginx:alpine
    container_name: hosting-nginx
    restart: unless-stopped
    volumes:
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/websites:/var/www
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/app-data/configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/app-data/configs/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/app-data/nginx-cache:/var/cache/nginx
    depends_on:
      - hosting-php-fpm
    networks:
      - hosting-net

  hosting-npm:
    image: hosting-npm:2.15.0
    build:
      context: ./npm-custom
    container_name: hosting-npm
    restart: always
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    environment:
      DB_MYSQL_HOST: hosting-db
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: ${NPM_DB_USER:-npm_db}
      DB_MYSQL_PASSWORD: ${NPM_DB_PASSWORD:?Set NPM_DB_PASSWORD in .env}
      DB_MYSQL_NAME: ${NPM_DB_NAME:-npm_db}
      INITIAL_ADMIN_EMAIL: ${NPM_IDENTITY:?Set NPM_IDENTITY in .env}
      INITIAL_ADMIN_PASSWORD: ${NPM_SECRET:?Set NPM_SECRET in .env}
    volumes:
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/app-data/npm/data:/data
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/app-data/npm/letsencrypt:/etc/letsencrypt
    depends_on:
      - hosting-db
    networks:
      - hosting-net

  hosting-redis:
    image: redis:7-alpine
    container_name: hosting-redis
    restart: unless-stopped
    command:
      redis-server
      --appendonly yes
      --save 900 1 --save 300 10 --save 60 10000
      --maxmemory ${REDIS_MAXMEMORY:-1024mb}
      --maxmemory-policy allkeys-lru
    volumes:
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/app-data/redis:/data
    networks:
      - hosting-net

  hosting-db:
    image: mysql:8.4
    container_name: hosting-db
    restart: always
    command: >
      --server-id=${MYSQL_SERVER_ID:-1}
      --log-bin=mysql-bin
      --binlog-format=row
      --innodb_buffer_pool_size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-2G}
      --innodb_redo_log_capacity=${MYSQL_INNODB_REDO_LOG_CAPACITY:-1G}
      --innodb_flush_log_at_trx_commit=2
      --innodb_flush_method=O_DIRECT
      --max_connections=${MYSQL_MAX_CONNECTIONS:-150}
      --skip-name-resolve=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${NPM_DB_NAME:-npm_db}
      MYSQL_USER: ${NPM_DB_USER:-npm_db}
      MYSQL_PASSWORD: ${NPM_DB_PASSWORD:?Set NPM_DB_PASSWORD in .env}
    volumes:
      - ${HOSTING_ROOT:-/media/ssdmount/websites-v2}/app-data/mysql:/var/lib/mysql
    networks:
      - hosting-net

  hosting-phpmyadmin:
    image: phpmyadmin:5.2.2-apache
    container_name: hosting-phpmyadmin
    restart: always
    environment:
      PMA_HOST: hosting-db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      UPLOAD_LIMIT: 64M
    ports:
      - "8484:80"
    depends_on:
      - hosting-db
    networks:
      - hosting-net

networks:
  hosting-net:
    name: hosting-net
    driver: bridge
