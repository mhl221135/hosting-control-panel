# Drop requests that do not match a configured proxy host. Keep the ACME
# webroot available so NPM can still complete HTTP-01 certificate challenges.
server {
	listen 80 default_server;
	listen [::]:80 default_server;

	server_name _;
	set $forward_scheme "http";
	set $server "127.0.0.1";
	set $port "80";
	access_log /data/logs/fallback_http_access.log standard;
	error_log /data/logs/fallback_http_error.log warn;
	include conf.d/include/letsencrypt-acme-challenge.conf;

	location / {
		return 444;
	}
}

server {
	listen 443 default_server ssl;
	listen [::]:443 default_server ssl;

	server_name _;
	access_log /data/logs/fallback_http_access.log standard;
	error_log /dev/null crit;
	include conf.d/include/ssl-ciphers.conf;
	ssl_reject_handshake on;

	return 444;
}
